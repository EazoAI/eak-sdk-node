image: node:20

stages:
  - verify

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm"
  PATH: "$PNPM_HOME:$PATH"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

verify:
  stage: verify
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.33.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm typecheck
    - pnpm test:ci
    - pnpm build
    - pnpm typecheck:examples
    - pnpm pack --dry-run
