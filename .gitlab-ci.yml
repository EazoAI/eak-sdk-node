image:
  name: node:20
  entrypoint: [""]

default:
  tags:
    - us

stages:
  - verify
  - release

variables:
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm"
  PATH: "$PNPM_HOME:$PATH"
  GITHUB_REPOSITORY: "EazoAI/eazo-eak-sdk-node"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

verify:
  stage: verify
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.33.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - pnpm typecheck
    - pnpm test:ci
    - pnpm build
    - pnpm typecheck:examples
    - pnpm pack --dry-run

sync_github:
  stage: release
  needs:
    - verify
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH'
      when: manual
    - when: never
  before_script:
    - git --version
  script:
    - test -n "$GITHUB_TOKEN"
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        git fetch origin "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}" || true
        git push github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
      else
        git push github "${CI_COMMIT_SHA}:refs/heads/${CI_COMMIT_REF_NAME}"
      fi
  after_script:
    - git remote remove github 2>/dev/null || true

publish_npm:
  stage: release
  needs:
    - verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
    - when: never
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.33.2 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  script:
    - test -n "$NPM_TOKEN"
    - pnpm build
    - printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
    - npm publish --access public
  after_script:
    - rm -f .npmrc
